name: Verse mail

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verse-mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-strip-types --test src/lib/verse-mail.test.ts src/lib/verse-signup-copy.test.ts
