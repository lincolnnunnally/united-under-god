name: customer-journeys

# Walks customer onboarding on the live sites with a real browser and stops at
# payment (see journeys/run.mjs). Screenshots and REPORT.md are pushed to the
# branch claude/customer-journeys-results.
on:
  push:
    branches: [claude/customer-journeys]
    paths: [journeys/**, .github/workflows/customer-journeys.yml]
  workflow_dispatch:
    inputs:
      invite_slugs:
        description: ChurchConnect invite slugs to walk (comma separated)
        required: false
        default: ""
      journeys:
        description: Which journeys (space separated, blank = all)
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: customer-journeys
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a browser
        run: |
          mkdir -p /tmp/j && cd /tmp/j && npm init -y >/dev/null && npm i playwright@1.52.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Walk the journeys
        env:
          INVITE_SLUGS: ${{ github.event.inputs.invite_slugs || vars.INVITE_SLUGS || '' }}
          OUT: ${{ github.workspace }}/journey-out
          NODE_PATH: /tmp/j/node_modules
        run: |
          cp journeys/run.mjs /tmp/j/run.mjs
          cd /tmp/j && node run.mjs ${{ github.event.inputs.journeys || '' }}
      - name: Publish screenshots and report
        if: always()
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git config user.name "customer-journeys"
          git config user.email "actions@users.noreply.github.com"
          run_dir="runs/$(date -u +%Y%m%d-%H%M)"
          git fetch origin claude/customer-journeys-results || true
          if git rev-parse --verify -q origin/claude/customer-journeys-results >/dev/null; then
            git checkout -B results origin/claude/customer-journeys-results
          else
            git checkout --orphan results && git rm -rqf . && git clean -fdq -e journey-out
          fi
          mkdir -p "$run_dir" && cp -r journey-out/. "$run_dir"/
          cp "$run_dir/REPORT.md" LATEST.md 2>/dev/null || true
          git add runs LATEST.md
          git commit -qm "Journey run $run_dir" || true
          git push -q origin HEAD:claude/customer-journeys-results
